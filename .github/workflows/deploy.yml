name: Build React App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug Files
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Searching package.json:"
          find . -name "package.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
